<section class="cnt" id="contact" data-sa="s2">
  <span class="sa-rule" aria-hidden="true"></span>
  <span class="sa-sweep" aria-hidden="true"></span>

  <div class="cbg" aria-hidden="true">
    <span class="c-grid c-grid--left"></span>
    <span class="c-grid"></span>
    <span class="c-ring c-ring--dash" style="--x:92%;--y:96%;--d:min(46vw,440px);--o:.55"></span>
    <span class="c-ring" style="--x:6%;--y:104%;--d:min(30vw,300px);--o:.45"></span>

    <span class="c-star" style="--x:74%;--y:78%;--s:14px;--o:.3"></span>
    <span class="c-star" style="--x:88%;--y:88%;--s:9px;--o:.24"></span>
    <span class="c-star" style="--x:14%;--y:90%;--s:11px;--o:.3"></span>
    <span class="c-dot" style="--x:66%;--y:90%;--s:4px;--o:.4"></span>
    <span class="c-dot" style="--x:80%;--y:68%;--s:3px;--o:.3"></span>
    <span class="c-dot" style="--x:22%;--y:84%;--s:3px;--o:.35"></span>
  </div>

  <div class="sa-inner">
    <div class="cnt-grid">
      <div>
        <p class="cnt-label">Contact</p>
        <h2 class="cnt-title">Say<br /><span class="cnt-knock">Hello</span></h2>
      </div>

      <div>
        <p class="cnt-note">
          Got an interesting project or want to collaborate? I'm always open
          to new conversations, web, games, or both.
        </p>
        <a class="cnt-mail" href="mailto:mumtaazraihaan@gmail.com">mumtaazraihaan@gmail.com</a>
        <div class="cnt-links">
          <a class="cnt-link" href="mailto:mumtaazraihaan@gmail.com">Email <span aria-hidden="true">↗</span></a>
          <a class="cnt-link cnt-link--ghost" href="https://github.com/tazzz-dev" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
          <a class="cnt-link cnt-link--ghost" href="https://linkedin.com/in/muhammadmumtaaz" target="_blank" rel="noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </div>
  </div>
</section>
